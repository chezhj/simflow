# Continuous integration.
#
# Runs the same checks the release gate runs (release-deploy.yaml), but on every
# push and pull request instead of only on a v* tag — so a regression surfaces at
# commit time rather than half way through a deploy.
name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"          # tags are handled by release-deploy.yaml / plugin-release.yml
  pull_request:

concurrency:
  # A new push to the same ref supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Pinned: an unpinned `pip install poetry` once resolved to Poetry 1.0.10,
          # which cannot read the [project] table and fails with "'name' is a
          # required property". A range makes pip fail loudly instead of downgrading.
          pip install "poetry>=2.1,<3"
          poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

  js:
    name: Browser helper unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install: the helpers are dependency-free and the
      # runner is Node's built-in `node --test`.
      - name: Run tests
        run: npm test

# Continuous integration.
#
# Runs on every PR, on every push to master, and is reused by release.yml (the Release
# workflow's first job). The pytest job is deliberately called `test`: its name is the
# status check shown on a PR, and the one a ruleset should require together with `pr-title`.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to the same PR supersedes its in-flight run. Pushes to master and the
  # run called from release.yml are never cancelled: a cancelled `test` would skip the
  # release bump. event_name is part of the key so those two cannot cancel each other
  # (when called, github.* is the caller's context).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # pytest.ini and manage.py already default to the dev settings; stated here so the
      # CI settings module is visible in one place.
      DJANGO_SETTINGS_MODULE: smart_training_checklist.settings.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # Pinned: an unpinned `pip install poetry` once resolved to Poetry 1.0.10,
          # which cannot read the [project] table and fails with "'name' is a
          # required property". A range makes pip fail loudly instead of downgrading.
          pip install "poetry>=2.1,<3"
          poetry install --no-interaction

      # No frontend build: the templates do not use compiled assets, so pytest does not
      # need node. (The `js` job below runs the browser-helper unit tests.)
      - name: Django system check
        run: poetry run python manage.py check

      - name: Run tests
        run: poetry run pytest

  js:
    name: Browser helper unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No dependencies to install: the helpers are dependency-free and the
      # runner is Node's built-in `node --test`.
      - name: Run tests
        run: npm test

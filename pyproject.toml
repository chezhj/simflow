[project]
name = "smarttrainingchecklist"
version = "2.10.4"
description = "Webapplication to assist flight procedure"
authors = [
    {name = "Hendrik-Jan",email = "h@vdwaal.net"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <4.0"
dependencies = [
    "django (>=5.2.1,<6.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-colorfield (>=0.14.0,<0.15.0)",
    "requests (>=2.32.3,<3.0.0)",
    "django-axes (>=8.3.1,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[tool.poetry.group.dev.dependencies]
factory-boy = "^3.3.3"
pylint-django = "^2.6.1"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-django = "^4.11.1"
commitizen = "^4.7.1"
djlint = "^1.36.4"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
ignored_tag_formats = ["plugin-v*", "sop*"]

version_files = [
    "smart_training_checklist/__init__.py",
]
# Refuse the release when the fixture's content moved but content_version did not
# — the same rule SOP_VERSIONING_SPEC.md plans to enforce at import time, caught
# here instead, before a tag exists. Non-zero exit aborts the bump; commitizen has
# written the version files by then but committed and tagged nothing, and the hook
# prints the restore line. Override with SIMFLOW_SKIP_CONTENT_CHECK=1.
pre_bump_hooks = [
  "python scripts/check_content_bump.py",
]

# Releases are made by the Release workflow (Actions > Release > Run workflow), which
# pushes the bump commit and the tag itself and then deploys that tag. This hook only
# reminds anyone who runs `cz bump` locally that nothing is pushed.
# If you do bump locally anyway, push the commit AND the tag (commitizen creates
# lightweight tags, which `git push --follow-tags` does not push):
#   git push && git push --tags
# The pushed v* tag deploys through release-deploy.yaml's tag trigger (manual fallback).
# No quotes or shell operators in the message: commitizen runs hooks through the
# platform shell, and on Windows cmd.exe a && inside quotes would still split the command.
post_bump_hooks = [
  "echo Bumped locally - nothing was pushed. Releases normally come from the Release workflow on GitHub.",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
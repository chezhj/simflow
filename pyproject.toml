[project]
name = "smarttrainingchecklist"
version = "2.7.0"
description = "Webapplication to assist flight procedure"
authors = [
    {name = "Hendrik-Jan",email = "h@vdwaal.net"}
]
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "django (>=5.2.1,<6.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "django-colorfield (>=0.14.0,<0.15.0)",
    "requests (>=2.32.3,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[tool.poetry.group.dev.dependencies]
factory-boy = "^3.3.3"
pylint-django = "^2.6.1"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-django = "^4.11.1"
commitizen = "^4.7.1"
djlint = "^1.36.4"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
ignored_tag_formats = ["plugin-v*", "sop*"]

version_files = [
    "smart_training_checklist/__init__.py",
]
# Run inline rather than calling a machine-local `push_all` script: that script
# lived outside the repo, so when it stopped working the release silently pushed
# the commit without the tag — and the tag is what triggers the deploy.
# Two commands because commitizen creates LIGHTWEIGHT tags, which
# `git push --follow-tags` does not push (it only follows annotated ones).
post_bump_hooks = [
  "git push",
  "git push --tags",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
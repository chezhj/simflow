[xflow]
api_key = paste-your-key-here
backend_url = https://simflow.vdwaal.net
log_level = INFO

# Seconds between dataref reads. 0.5 (2 Hz) is the default and is what the
# checklist is tuned for. Raise it if xFlow costs you frames; the trade is a
# longer wait before a switch change is noticed. Range 0.1-4.0 — values
# outside it are clamped, and anything from 5.0 up would make the web page
# show the sim as disconnected between ticks.
poll_interval = 0.5
